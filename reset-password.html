<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose a new password — KULEXO</title><style>:root{--ink:#0d0d0d;--paper:#f5f1e9;--accent:#d5ff3f;--muted:#706d67}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}.nav{background:var(--ink);padding:20px 6%}.nav-inner{display:flex;justify-content:space-between;max-width:1180px;margin:auto}.logo,.back{color:#fff;text-decoration:none}.logo{font-weight:900;font-size:22px}.logo span{color:var(--accent)}.back{font-size:14px}main{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:50px 20px}.card{width:min(100%,470px);padding:42px;background:#fff;border:1px solid #d8d2c7;box-shadow:10px 10px 0 var(--ink)}.eyebrow{color:#5b6e00;font-size:11px;font-weight:bold;letter-spacing:1.4px}h1{font-size:40px;letter-spacing:-2px;margin:10px 0}p{color:var(--muted);line-height:1.55}label{display:block;margin:22px 0 7px;font-size:13px;font-weight:bold}input,button{width:100%;padding:13px;font:inherit}input{border:1px solid var(--ink)}button{margin-top:24px;border:0;background:var(--ink);color:#fff;font-weight:bold;cursor:pointer}.message{min-height:24px;margin-top:18px;color:#5b6e00;font-size:14px}</style></head><body><header class="nav"><div class="nav-inner"><a class="logo" href="index.html">KUL<span>EX</span>O</a><a class="back" href="login.html">← Back to login</a></div></header><main><section class="card"><div class="eyebrow">PASSWORD RESET</div><h1>Choose a new password.</h1><p>Use a new password with at least eight characters.</p><form id="resetForm"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Update password</button></form><p class="message" id="message" aria-live="polite"></p></section></main><script type="module">import {handleResetPassword,isSupabaseConfigured} from "./assets/js/auth.js";const form=document.getElementById("resetForm"),message=document.getElementById("message");form.addEventListener("submit",async e=>{e.preventDefault();if(!isSupabaseConfigured){message.textContent="KULEXO account setup is not configured yet.";return}try{await handleResetPassword(form);message.textContent="Password updated. Redirecting to your account…";setTimeout(()=>location.assign("account.html"),900)}catch(error){message.textContent=error.message}});</script></body></html>
