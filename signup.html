<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up — KULEXO</title>
  <style>:root{--ink:#0d0d0d;--paper:#f5f1e9;--accent:#d5ff3f;--muted:#706d67}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Arial,Helvetica,sans-serif}.nav{background:var(--ink);padding:20px 6%}.nav-inner{display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:auto}.logo{color:#fff;text-decoration:none;font-weight:900;letter-spacing:-1px;font-size:22px}.logo span{color:var(--accent)}.back{color:#fff;text-decoration:none;font-size:14px}main{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:50px 20px}.card{width:min(100%,470px);background:#fff;padding:42px;border:1px solid #d8d2c7;box-shadow:10px 10px 0 var(--ink)}.eyebrow{color:#5b6e00;font-size:11px;font-weight:700;letter-spacing:1.4px}h1{margin:10px 0;font-size:42px;letter-spacing:-2px}p{line-height:1.55;color:var(--muted)}label{display:block;margin:20px 0 7px;font-size:13px;font-weight:700}input{width:100%;border:1px solid var(--ink);padding:13px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;background:var(--ink);color:#fff;cursor:pointer;font-weight:700}.links{margin-top:22px;font-size:14px}.message{min-height:24px;margin-top:18px;color:#5b6e00;font-size:14px}</style>
</head>
<body><header class="nav"><div class="nav-inner"><a class="logo" href="index.html">KUL<span>EX</span>O</a><a class="back" href="index.html">← Back to KULEXO</a></div></header><main><section class="card"><div class="eyebrow">KULEXO ACCOUNT</div><h1>Create your account.</h1><p>Save designs now and unlock easier access to future purchases later.</p><form id="signupForm"><label for="display_name">Name <small>(optional)</small></label><input id="display_name" name="display_name" type="text" autocomplete="name"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Create account</button></form><p class="message" id="message" aria-live="polite"></p><div class="links"><a href="login.html">Already have an account? Log in</a></div></section></main><script type="module">import { handleSignup,isSupabaseConfigured } from "./assets/js/auth.js";const form=document.getElementById("signupForm"),message=document.getElementById("message");form.addEventListener("submit",async e=>{e.preventDefault();if(!isSupabaseConfigured){message.textContent="KULEXO account setup is not configured yet.";return}try{message.textContent="Creating your account…";const result=await handleSignup(form);message.textContent=result;if(result.startsWith("Your account"))location.assign("account.html")}catch(error){message.textContent=error.message}});</script></body>
</html>
