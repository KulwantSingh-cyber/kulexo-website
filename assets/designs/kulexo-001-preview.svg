<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17145c"/>
      <stop offset="100%" stop-color="#5b52ff"/>
    </linearGradient>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.10"
            stroke-width="1"/>
    </pattern>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18"
                    flood-color="#11111a"
                    flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="40" fill="url(#bg)"/>
  <rect width="800" height="800" rx="40" fill="url(#grid)"/>

  <!-- Design number -->
  <text x="45" y="65"
        fill="#ffffff"
        fill-opacity="0.85"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="700">
    01
  </text>

  <!-- Premium badge -->
  <rect x="560" y="38" width="190" height="58" rx="29"
        fill="#ffffff"
        fill-opacity="0.96"/>

  <text x="655" y="74"
        text-anchor="middle"
        fill="#111111"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="700">
    ✦ Premium Design
  </text>

  <!-- Jersey shadow -->
  <path d="M285 235
           L205 285
           L245 400
           L305 365
           L305 570
           L495 570
           L495 365
           L555 400
           L595 285
           L515 235
           L455 275
           L345 275
           Z"
        fill="#11111a"
        opacity="0.35"
        filter="url(#shadow)"/>

  <!-- Jersey -->
  <path d="M285 220
           L205 270
           L245 385
           L305 350
           L305 555
           L495 555
           L495 350
           L555 385
           L595 270
           L515 220
           L455 260
           L345 260
           Z"
        fill="#f7f7ff"/>

  <!-- Collar -->
  <path d="M345 220
           L375 260
           L425 260
           L455 220
           L435 205
           L365 205
           Z"
        fill="#e9e9ff"/>

  <!-- Jersey center detail -->
  <rect x="305" y="350" width="190" height="8"
        fill="#665cff"
        opacity="0.45"/>

  <!-- KULEXO logo -->
  <text x="400" y="430"
        text-anchor="middle"
        fill="#5148d8"
        font-family="Arial, sans-serif"
        font-size="28"
        font-weight="800"
        letter-spacing="1">
    KULEXO
  </text>

  <!-- Collection label -->
  <text x="45" y="745"
        fill="#ffffff"
        fill-opacity="0.85"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="700"
        letter-spacing="0.5">
    KULEXO / PERFORMANCE COLLECTION
  </text>
</svg>
