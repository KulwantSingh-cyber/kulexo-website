<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My account — KULEXO</title><style>:root{--ink:#0d0d0d;--paper:#f5f1e9;--accent:#d5ff3f;--muted:#706d67}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}.nav{background:var(--ink);padding:20px 6%}.nav-inner{display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:auto}.logo{color:#fff;text-decoration:none;font-size:22px;font-weight:900}.logo span{color:var(--accent)}.nav-actions{display:flex;gap:17px;align-items:center}.nav-actions a{color:#fff;text-decoration:none;font-size:14px}.nav-actions .btn{background:var(--accent);color:var(--ink);padding:10px 15px;font-weight:bold}main{max-width:920px;margin:0 auto;padding:62px 24px}.eyebrow{font-size:11px;font-weight:bold;letter-spacing:1.4px;color:#5b6e00;text-transform:uppercase}h1{font-size:48px;letter-spacing:-2px;margin:10px 0}.intro{color:var(--muted);margin-bottom:40px}.panel{background:#fff;border:1px solid #d8d2c7;padding:30px;margin-top:24px}.panel h2{margin:0 0 18px;font-size:25px}.profile-email{color:var(--muted)}.saved-design{display:flex;justify-content:space-between;gap:22px;align-items:center;padding:20px 0;border-top:1px solid #e2ddd4}.saved-design h3{margin:5px 0;font-size:19px}.saved-design p{margin:0;color:var(--muted)}.saved-actions{display:flex;gap:12px;align-items:center}.text-link,.empty-state a{color:var(--ink);font-weight:bold}.remove-saved{border:1px solid var(--ink);background:#fff;padding:9px 12px;cursor:pointer;font-weight:bold}.empty-state{color:var(--muted)}@media(max-width:600px){h1{font-size:38px}.saved-design{align-items:flex-start;flex-direction:column}}</style></head><body><header class="nav"><div class="nav-inner"><a class="logo" href="index.html">KUL<span>EX</span>O</a><div class="nav-actions" data-auth-nav data-cta-class="btn"></div></div></header><main><div class="eyebro
