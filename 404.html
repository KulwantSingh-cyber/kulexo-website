<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — KULEXO</title>
  <meta name="description" content="The KULEXO page you requested could not be found.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    body { margin: 0; background: var(--k-bg); color: var(--k-ink); font: 16px/1.5 Arial, Helvetica, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px 24px; }
    .panel { width: min(100%, 620px); padding: clamp(28px, 6vw, 64px); background: var(--k-surface); border: 1px solid var(--k-line); border-radius: var(--k-radius); box-shadow: var(--k-shadow); }
    .eyebrow { color: var(--k-accent); font-size: 12px; font-weight: 800; letter-spacing: 1.2px; }
    h1 { margin: 10px 0 12px; font-size: clamp(42px, 8vw, 76px); letter-spacing: -.055em; line-height: .98; }
    p { color: var(--k-muted); max-width: 48ch; }
    a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 12px; padding: 0 16px; border-radius: 10px; background: var(--k-ink); color: #fff; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <div class="eyebrow">404 / PAGE NOT FOUND</div>
      <h1>That page moved.</h1>
      <p>The page may have been renamed or the link may be outdated. Return to the KULEXO design library to continue browsing.</p>
      <a href="index.html">Back to KULEXO</a>
    </section>
  </main>
</body>
</html>
