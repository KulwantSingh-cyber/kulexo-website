<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout — KULEXO</title><style>:root{--ink:#101114;--bg:#f7f7f5;--muted:#697080;--accent:#635bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}.nav{background:var(--ink);padding:18px 6%}.nav-inner{max-width:760px;margin:auto;display:flex;justify-content:space-between}.nav a{color:#fff}.logo{font-weight:900;text-decoration:none;font-size:22px}.logo span{color:#b8b2ff}main{max-width:760px;margin:auto;padding:70px 24px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.2px}.panel{margin-top:18px;background:#fff;border:1px solid #e4e4e8;padding:28px}.notice{background:#f0efff;padding:16px}.muted{color:var(--muted)}a.button{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:13px 16px;font-weight:800}</style></head>
<body><header class="nav"><div class="nav-inner"><a class="logo" href="index.html">KUL<span>EX</span>O</a><a href="cart.html">Back to cart</a></div></header><main><div class="eyebrow">SECURE CHECKOUT</div><h1>Continue to Stripe Test Mode.</h1><section class="panel"><p class="notice">This staging flow only redirects to Stripe Test Mode. No live keys, live charges, or paid files are used.</p><form id="checkoutForm"><label for="email">Email for order updates <span aria-hidden="true">*</span></label><input id="email" name="email" type="email" autocomplete="email" required><button class="button" type="submit">Open test checkout</button></form><p id="checkoutMessage" class="muted" aria-live="polite"></p></section></main><script type="module">
    import { getCartProducts, clearCart } from "./assets/js/cart.js";
    import { createCheckoutSession } from "./assets/js/commerce.js";
    import { getCurrentUser } from "./assets/js/auth.js";
    const form = document.getElementById("checkoutForm");
    const message = document.getElementById("checkoutMessage");
    const user = await getCurrentUser().catch(() => null);
    if (user?.email) { form.email.value = user.email; form.email.readOnly = true; }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const products = await getCartProducts();
      if (!products.length) { message.textContent = "Your cart is empty."; return; }
      const button = form.querySelector("button");
      button.disabled = true;
      message.textContent = "Preparing Stripe Test Mode checkout…";
      try {
        const result = await createCheckoutSession(
          products.map(product => product.product.product_key),
          form.email.value.trim(),
          Boolean(user)
        );
        if (!result.checkout_url) throw new Error("Checkout is not configured for staging.");
        clearCart();
        location.assign(result.checkout_url);
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script></body></html>
