<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Downloads — KULEXO</title><style>body{margin:0;background:#f7f7f5;color:#101114;font:16px/1.5 Arial;padding:64px 24px}main{max-width:760px;margin:auto}.panel{background:#fff;border:1px solid #e4e4e8;padding:28px}.eyebrow{color:#635bff;font-size:12px;font-weight:800}a{color:#101114;font-weight:700}.download{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:1px solid #e4e4e8;padding:16px 0}.download button{background:#101114;color:#fff;border:0;padding:10px 14px;font-weight:700}</style></head><body><main><div class="eyebrow">SECURE DOWNLOADS</div><h1>Your downloads.</h1><section class="panel"><p>Each link is generated after the server verifies an active entitlement and expires after five minutes.</p><div id="downloadList">Loading eligible downloads…</div><p id="message" aria-live="polite"></p><a href="account.html">Back to account</a></section></main><script type="module">
    import { requireSupabase } from "./assets/js/supabase-client.js";
    import { createAuthenticatedDownload } from "./assets/js/commerce.js";
    const list = document.getElementById("downloadList");
    const message = document.getElementById("message");
    try {
      const { data, error } = await requireSupabase().from("orders").select("id,order_number,order_items(product_id,product_name)").order("created_at", { ascending: false });
      if (error) throw error;
      const items = (data || []).flatMap(order => (order.order_items || []).map(item => ({ ...item, order_number: order.order_number })));
      if (!items.length) list.textContent = "No eligible orders found.";
      else {
        list.innerHTML = items.map(item => `<div class="download"><span>${item.product_name} <small>(${item.order_number})</small></span><button type="button" data-product-id="${item.product_id}">Create secure link</button></div>`).join("");
        list.querySelectorAll("[data-product-id]").forEach(button => button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            const result = await createAuthenticatedDownload(button.dataset.productId);
            window.open(result.download_url, "_blank", "noopener");
            message.textContent = "Secure link created. It expires in five minutes.";
          } catch (error) {
            message.textContent = error.message;
            button.disabled = false;
          }
        }));
      }
    } catch (error) {
      list.textContent = "Orders could not be loaded.";
      message.textContent = error.message;
    }
  </script></body></html>
