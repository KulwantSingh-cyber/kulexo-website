<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recover a purchase — KULEXO</title><style>body{margin:0;background:#f7f7f5;color:#101114;font:16px/1.5 Arial;padding:64px 24px}main{max-width:560px;margin:auto;background:#fff;border:1px solid #e4e4e8;padding:30px}.eyebrow{color:#635bff;font-size:12px;font-weight:800}label{display:block;font-weight:700;margin:18px 0 6px}input{width:100%;padding:12px;border:1px solid #101114;box-sizing:border-box}button{margin-top:18px;background:#101114;color:#fff;border:0;padding:13px 16px;font-weight:800}p{color:#697080}</style></head><body><main><div class="eyebrow">PURCHASE RECOVERY</div><h1>Recover a guest purchase.</h1><p>Enter the email used at test checkout. If an eligible order exists, a short-lived recovery link will be sent.</p><form id="recoveryForm"><label for="email">Purchase email</label><input id="email" name="email" type="email" autocomplete="email" required><button type="submit">Request recovery link</button></form><p id="message" aria-live="polite"></p><div id="downloadArea"></div><script type="module">
    import { requestPurchaseRecovery, createGuestDownload } from "./assets/js/commerce.js";
    const form = document.getElementById("recoveryForm");
    const message = document.getElementById("message");
    const token = new URLSearchParams(location.search).get("token");
    if (token) {
      form.hidden = true;
      message.textContent = "Preparing your secure staging download…";
      createGuestDownload(token).then(result => {
        const link = document.createElement("a");
        link.href = result.download_url;
        link.textContent = "Download purchased file";
        link.target = "_blank";
        link.rel = "noopener";
        document.getElementById("downloadArea").append(link);
        message.textContent = "The secure link expires shortly.";
      }).catch(error => { message.textContent = error.message; });
    }
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      message.textContent = "Requesting a recovery email…";
      try {
        await requestPurchaseRecovery(form.email.value.trim());
        message.textContent = "If an eligible staging purchase exists, a recovery email has been sent.";
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script></main></body></html>
