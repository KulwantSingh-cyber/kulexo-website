<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — KULEXO</title><style>:root{--ink:#101114;--bg:#f7f7f5;--line:#e3e4e8;--accent:#635bff;--muted:#697080}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.nav{background:#fff;border-bottom:1px solid var(--line);padding:20px 6%}.nav-inner{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo,a{color:inherit;text-decoration:none}.logo{font-weight:900;font-size:23px}.logo span{color:var(--accent)}.cart-link{font-weight:800}.count{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px}main{max-width:900px;margin:auto;padding:64px 24px}.eyebrow{font-size:11px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:1.3px}h1{font-size:48px;letter-spacing:-2px;margin:8px 0 28px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}.cart-item{display:flex;justify-content:space-between;gap:20px;padding:20px 0;border-top:1px solid var(--line)}.cart-item:first-child{border-top:0}.cart-item h3{margin:4px 0}.cart-item p{color:var(--muted);margin:0}.cart-controls{display:flex;align-items:center;gap:10px}.cart-controls button{border:1px solid var(--ink);background:#fff;border-radius:8px;padding:7px 11px;font-weight:800;cursor:pointer}.cart-controls .remove{margin-left:8px}.actions{display:flex;gap:12px;margin-top:24px;align-items:center}.btn{border:0;border-radius:12px;padding:14px 18px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}.text-btn{border:0;background:none;text-decoration:underline;cursor:pointer}.empty-state{color:var(--muted)}.empty-state a{text-decoration:underline;color:var(--ink);font-weight:800}.message{color:var(--muted);font-size:14px}@media(max-width:600px){h1{font-size:38px}.cart-item{flex-direction:column}.actions{flex-direction:column;align-items:stretch}.cart-controls{flex-wrap:wrap}}</style></head><body><header class="nav"><div class="nav-inner"><a class="logo" href="index.html">KUL<span>EX</span>O</a><a class="cart-link" href="cart.html">Cart <span class="count" data-cart-count>0</span></a></div></header><main><p class="eyebrow">KULEXO CART</p><h1>Your selections.</h1><section class="panel"><div id="cartItems"><p class="empty-state">Loading cart…</p></div><div class="actions"><button class="btn" id="checkoutButton" type="button">Continue to secure checkout</button><button class="text-btn" id="clearCart" type="button">Clear cart</button></div><p class="message" id="checkoutMessage" aria-live="polite"></p></section></main><script type="module">import{initCartCount,initCartPage}from"./assets/js/cart.js";import{initCheckoutButton}from"./assets/js/checkout.js";initCartCount();initCartPage().catch(error=>{document.getElementById("cartItems").textContent="We could not load your cart.";console.error(error)});initCheckoutButton();</script></body></html>
